legal_documents:
  type: MemoryDataset
  #Kedro usually does a deep-copy of a dataset for MemoryDataset to avoid modifying the original data, but some data types are not serializable, so it's not supported. 
  copy_mode: assign

"{namespace}.loaded_legal_documents":
  type: pandas.CSVDataset
  filepath: "data/02_intermediate/{namespace}.loaded_legal_documents.csv"
  save_args:
    index: False
    encoding: utf-8
  load_args:
    encoding: utf-8
  metadata:
    expected_columns: ["page_content", "folder","source", "text_length","page_label", "page_title","URL","category","year", "country", "language", "file_type", "is_document_scanned"]

chunked_docs:
  type: pandas.CSVDataset
  filepath: data/03_primary/preprocessed_docs.csv
  save_args:
    index: False
    encoding: utf-8
    errors: replace
  load_args:
    encoding: utf-8
    # TODO:  Restart the pipeline process to to have all the intended columns. 
  metadata:
    expected_columns : ['chunk_id', 'page_content', 'document_id', 'page_labels', 'start_char_idx', 'end_char_idx', 'chunk_length', 'num_pages_spanned', 'folder', 'source', 'file_type',  'URL', 'page_title', 'category', 'year', 'country', 'language', "is_document_scanned"]
legal_docs_world_map:
  type: plotly.JSONDataset
  filepath: data/09_reporting/legal_docs_world_map.json
  save_args:
    engine: auto
year_title_bar_plot:
  type: pickle.PickleDataset
  filepath: data/09_reporting/year_title_bar_plot.pkl