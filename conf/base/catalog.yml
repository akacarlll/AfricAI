legal_documents:
  type: MemoryDataset
  #Kedro usually does a deep-copy of a dataset for MemoryDataset to avoid modifying the original data, but some data types are not serializable, so it's not supported. 
  copy_mode: assign

cleaned_legal_documents:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/df_legal.csv
  save_args:
    index: False
    encoding: utf-8
  load_args:
    encoding: utf-8
  metadata:
    expected_columns: ["page_content", "folder","source", "text_length","page_label", "page_title","URL","category","year", "year_maybe", "country", "language", "Claimant", "Chamber", "Against","Appeal","Judgment","Case", "Defendant", "Court","Section", "file_type"]

chunked_docs:
  type: pandas.CSVDataset
  filepath: data/03_primary/preprocessed_docs.csv
  save_args:
    index: False
    encoding: latin1
    errors: replace
  load_args:
    encoding: latin1
    # TODO:  Restart the pipeline process to to have all the intended columns. 
  metadata:
    # expected_columns: ["chunk_id", "chunk_text", "document_id", "page_labels", "page_title", "metadata", "start_char_idx", "end_char_idx", "category"] 
    expected_columns : ['chunk_id', 'page_content', 'document_id', 'page_labels', 'start_char_idx', 'end_char_idx', 'chunk_length', 'num_pages_spanned', 'folder', 'source', 'file_type',  'URL', 'page_title', 'category', 'year', 'year_maybe', 'country', 'language', 'Case', 'Judgment', 'Defendant', 'Section', 'Appeal', 'Court', 'Chamber', 'Against','Claimant', 'metadata']
